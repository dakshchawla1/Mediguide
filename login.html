<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MediGuide</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #c9a84c; --gold-light: #f0d080; --gold-dim: #8a6f2e; --bg: #04040c; --card: #08081a; --border: #12122a; --text: #e8e8f8; --muted: #5a5a80; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 24px 60px; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold-dim), var(--gold)); border-radius: 10px; }

    body::after { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9999; opacity: 0.4; }
    .center-glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; z-index: 0; border-radius: 50%; }
    .cursor { width: 400px; height: 400px; background: radial-gradient(circle, rgba(201,168,76,0.025), transparent 70%); position: fixed; border-radius: 50%; pointer-events: none; z-index: 1; transform: translate(-50%,-50%); transition: left 0.15s ease, top 0.15s ease; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; height: 72px; background: rgba(4,4,12,0.85); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(201,168,76,0.08); }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--gold-dim), var(--gold)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--gold-light); }
    .nav-back { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .nav-back:hover { color: var(--gold-light); }

    @media (max-width: 480px) {
      .navbar { padding: 0 20px; }
      .login-card { padding: 32px 20px; }
      .login-title { font-size: 24px; }
    }

    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }
    @keyframes goldShimmer { to { background-position: 200% center; } }

    .login-wrap { width: 100%; max-width: 460px; position: relative; z-index: 2; animation: fadeUp 0.6s ease both; }

    .login-card { background: var(--card); border: 1px solid rgba(201,168,76,0.1); border-radius: 28px; padding: 48px 40px; }

    .login-top { text-align: center; margin-bottom: 36px; }
    .login-icon { width: 68px; height: 68px; border-radius: 20px; background: linear-gradient(135deg, var(--gold-dim), var(--gold)); display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 20px; box-shadow: 0 0 40px rgba(201,168,76,0.25); }
    .login-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: #f0f0ff; letter-spacing: -0.5px; margin-bottom: 8px; }
    .login-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }

    /* GOOGLE BTN */
    .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; background: white; color: #1a1a2e; font-size: 15px; font-weight: 600; padding: 15px 24px; border-radius: 14px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; box-shadow: 0 4px 24px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .google-btn:active { transform: translateY(0); }

    .or-divider { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .or-line { flex: 1; height: 1px; background: rgba(201,168,76,0.08); }
    .or-text { font-size: 12px; color: #2e2e50; font-weight: 500; letter-spacing: 0.05em; }

    /* TABS */
    .auth-tabs { display: flex; background: var(--bg); border: 1px solid rgba(201,168,76,0.1); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .auth-tab { flex: 1; padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted); font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .auth-tab.active { background: rgba(201,168,76,0.1); color: var(--gold-light); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* FORM */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 700; color: rgba(201,168,76,0.5); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; display: block; }
    .form-input { width: 100%; background: var(--bg); border: 1px solid rgba(201,168,76,0.1); border-radius: 12px; padding: 14px 18px; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; }
    .form-input:focus { border-color: rgba(201,168,76,0.3); box-shadow: 0 0 0 3px rgba(201,168,76,0.06); }
    .form-input::placeholder { color: #1e1e38; }

    .forgot { text-align: right; margin-top: -8px; margin-bottom: 16px; }
    .forgot a { font-size: 12px; color: #3a3a60; text-decoration: none; transition: color 0.2s; }
    .forgot a:hover { color: var(--gold); }

    .btn-gold { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #8a6f2e, var(--gold), #8a6f2e); background-size: 200% auto; color: #04040c; font-size: 15px; font-weight: 700; padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: 0.03em; box-shadow: 0 0 40px rgba(201,168,76,0.2); transition: all 0.3s; animation: goldShimmer 4s linear infinite; margin-bottom: 20px; }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 0 60px rgba(201,168,76,0.35); }

    .login-footer { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .login-footer a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .login-footer a:hover { color: var(--gold-light); }

    .features-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid rgba(201,168,76,0.06); }
    .feat-item { text-align: center; }
    .feat-emoji { font-size: 20px; display: block; margin-bottom: 5px; }
    .feat-text { font-size: 11px; color: #2a2a45; }

    .trust-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; font-size: 12px; color: #2a2a45; }
    .trust-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; animation: blink 2s infinite; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="center-glow"></div>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">⚕️</div>
      <span class="logo-text">MediGuide</span>
    </a>
    <a href="index.html" class="nav-back">← Back to Home</a>
  </nav>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-top">
        <div class="login-icon">⚕️</div>
        <div class="login-title">Welcome to MediGuide</div>
        <div class="login-sub">Sign in to save your health history, emergency contacts and preferences</div>
      </div>

      <!-- GOOGLE -->
      <button class="google-btn" onclick="googleLogin()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <div class="or-divider">
        <div class="or-line"></div>
        <span class="or-text">OR</span>
        <div class="or-line"></div>
      </div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('signin', this)">Sign In</button>
        <button class="auth-tab" onclick="switchTab('signup', this)">Create Account</button>
      </div>

      <!-- SIGN IN -->
      <div class="tab-panel active" id="panel-signin">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-input" id="signin-email" type="email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" id="signin-pass" type="password" placeholder="Enter your password" />
        </div>
        <div class="forgot"><a href="#">Forgot password?</a></div>
        <button class="btn-gold" onclick="emailSignIn()">Sign In to MediGuide →</button>
      </div>

      <!-- SIGN UP -->
      <div class="tab-panel" id="panel-signup">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-input" id="signup-name" type="text" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-input" id="signup-email" type="email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" id="signup-pass" type="password" placeholder="Create a strong password (min 6 chars)" />
        </div>
        <button class="btn-gold" onclick="emailSignUp()">Create Account →</button>
      </div>

      <div class="login-footer">
        By signing in you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
      </div>

      <div class="features-row">
        <div class="feat-item"><span class="feat-emoji">💾</span><div class="feat-text">Save history</div></div>
        <div class="feat-item"><span class="feat-emoji">🚨</span><div class="feat-text">SOS contacts</div></div>
        <div class="feat-item"><span class="feat-emoji">🔔</span><div class="feat-text">Reminders</div></div>
        <div class="feat-item"><span class="feat-emoji">🌐</span><div class="feat-text">Hindi & English</div></div>
      </div>

      <div class="trust-row">
        <div class="trust-dot"></div>
        Your data is private and secure
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('mousemove', e => {
      document.getElementById('cursor').style.left = e.clientX + 'px';
      document.getElementById('cursor').style.top = e.clientY + 'px';
    });

    function showToast(msg, type = 'gold') {
      const existing = document.querySelector('.toast-msg');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.textContent = msg;
      toast.style.cssText = `position: fixed; bottom: 32px; right: 32px; z-index: 99999; background: ${type === 'success' ? 'rgba(52,211,153,0.12)' : type === 'error' ? 'rgba(248,113,113,0.12)' : 'rgba(201,168,76,0.12)'}; border: 1px solid ${type === 'success' ? 'rgba(52,211,153,0.3)' : type === 'error' ? 'rgba(248,113,113,0.3)' : 'rgba(201,168,76,0.3)'}; color: ${type === 'success' ? '#34d399' : type === 'error' ? '#f87171' : '#c9a84c'}; padding: 14px 24px; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    const sty = document.createElement('style');
    sty.textContent = `@keyframes toastIn { from { opacity:0; transform: translateY(20px) scale(0.9); } to { opacity:1; transform: translateY(0) scale(1); } }`;
    document.head.appendChild(sty);

    function switchTab(tab, btn) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    function googleLogin() {
      showToast('🔐 Google Sign-in coming in Week 5 with Firebase!', 'gold');
    }

    function emailSignIn() {
      const email = document.getElementById('signin-email').value.trim();
      const pass = document.getElementById('signin-pass').value.trim();
      if (!email || !pass) { showToast('⚠️ Please fill in all fields', 'error'); return; }
      if (!email.includes('@')) { showToast('⚠️ Please enter a valid email', 'error'); return; }
      if (pass.length < 6) { showToast('⚠️ Password must be at least 6 characters', 'error'); return; }
      showToast('✅ Sign-in will work after Firebase in Week 5!', 'gold');
      setTimeout(() => window.location.href = 'index.html', 2000);
    }

    function emailSignUp() {
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-pass').value.trim();
      if (!name || !email || !pass) { showToast('⚠️ Please fill in all fields', 'error'); return; }
      if (!email.includes('@')) { showToast('⚠️ Please enter a valid email', 'error'); return; }
      if (pass.length < 6) { showToast('⚠️ Password must be at least 6 characters', 'error'); return; }
      showToast('✅ Account creation coming in Week 5 with Firebase!', 'gold');
      setTimeout(() => window.location.href = 'index.html', 2000);
    }
  </script>
</body>
</html>
