<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0c1726" />
      <stop offset="100%" stop-color="#06121e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes dash {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.6); opacity: 0.3; }
        100% { transform: scale(1); opacity: 0.9; }
      }
      @keyframes floatCross {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
        50% { transform: translateY(-5px) rotate(3deg); opacity: 0.8; }
        100% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
      }
      @keyframes textShimmer {
        0% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.6)); }
        100% { opacity: 0.85; }
      }
      .ecg-line {
        stroke-dasharray: 1200;
        animation: dash 4s linear infinite;
      }
      .floating-cross {
        animation: floatCross 3s ease-in-out infinite;
        transform-origin: center;
      }
      .glowing-title {
        animation: textShimmer 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="176" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Grid Overlay -->
  <rect x="2" y="2" width="916" height="176" rx="16" fill="url(#grid)" />

  <!-- Medical Cross Floating Left -->
  <g class="floating-cross" transform="translate(45, 45)">
    <rect x="18" y="0" width="14" height="50" rx="4" fill="#059669" opacity="0.85" />
    <rect x="0" y="18" width="50" height="14" rx="4" fill="#059669" opacity="0.85" />
    <circle cx="25" cy="25" r="28" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
  </g>

  <!-- Brand Typography -->
  <text x="125" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5px" class="glowing-title">
    MediGuide<tspan fill="#10b981"> India</tspan>
  </text>
  <text x="125" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.2px">
    National Citizen Clinical Navigation, Generic Formulary &amp; OPD Timetable Registry
  </text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(730, 42)">
    <rect x="0" y="0" width="145" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" style="animation: pulseDot 1.8s infinite;" />
    <circle cx="16" cy="15" r="9" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4" />
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#10b981" letter-spacing="0.5px">LIVE ONLINE 24/7</text>
  </g>

  <!-- Animated EKG / Heartbeat Pulse Line -->
  <g transform="translate(0, 35)">
    <!-- Base subtle track -->
    <path d="M 30 95 L 180 95 L 205 95 L 215 75 L 225 120 L 235 50 L 245 135 L 255 90 L 265 100 L 275 95 L 430 95 L 455 95 L 465 75 L 475 120 L 485 50 L 495 135 L 505 90 L 515 100 L 525 95 L 680 95 L 705 95 L 715 75 L 725 120 L 735 50 L 745 135 L 755 90 L 765 100 L 775 95 L 890 95" 
          fill="none" stroke="rgba(16, 185, 129, 0.12)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Glowing Active Animated ECG wave -->
    <path class="ecg-line" 
          d="M 30 95 L 180 95 L 205 95 L 215 75 L 225 120 L 235 50 L 245 135 L 255 90 L 265 100 L 275 95 L 430 95 L 455 95 L 465 75 L 475 120 L 485 50 L 495 135 L 505 90 L 515 100 L 525 95 L 680 95 L 705 95 L 715 75 L 725 120 L 735 50 L 745 135 L 755 90 L 765 100 L 775 95 L 890 95" 
          fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  </g>
</svg>
